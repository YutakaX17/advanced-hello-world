name: Release distribution

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundle
        run: |
          mkdir -p release/advanced-hello-world
          cp compose.yml .env.example README.md LICENSE release/advanced-hello-world/
          cp -R docs release/advanced-hello-world/
          tar -C release -czf release/advanced-hello-world-${GITHUB_REF_NAME}.tar.gz advanced-hello-world
          sha256sum release/*.tar.gz > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
