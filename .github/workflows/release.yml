name: Release distribution

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release bundle
        run: |
          mkdir -p release/advanced-hello-world
          cp compose.yml .env.example versions.yml README.md CHANGELOG.md LICENSE release/advanced-hello-world/
          cp -R docs release/advanced-hello-world/
          cp -R scripts release/advanced-hello-world/
          tar -C release -czf release/advanced-hello-world-${GITHUB_REF_NAME}.tar.gz advanced-hello-world
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
      - run: sha256sum release/*.tar.gz release/sbom.spdx.json > release/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/sbom.spdx.json
            release/SHA256SUMS
